<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 527" width="703" height="527" role="img" aria-label="PostBoost - picking the best photo from a set of similar shots">
  <defs>
    <!-- Site palette: #2b7a69 primary, #a0e2e1 / #c7eeed light accents -->
    <linearGradient id="pbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5449"/>
      <stop offset="0.55" stop-color="#2b7a69"/>
      <stop offset="1" stop-color="#35937d"/>
    </linearGradient>
    <linearGradient id="pbCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4f2"/>
    </linearGradient>
    <linearGradient id="pbPhoto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7eeed"/>
      <stop offset="1" stop-color="#a0e2e1"/>
    </linearGradient>
    <linearGradient id="pbBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a1"/>
      <stop offset="1" stop-color="#e0921f"/>
    </linearGradient>
    <filter id="pbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d2b25" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="703" height="527" fill="url(#pbBg)"/>

  <!-- faint grid, the measuring motif -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 176H703M0 351H703M234 0V527M469 0V527"/>
  </g>

  <!-- two rejected frames, tilted behind -->
  <g filter="url(#pbShadow)">
    <g transform="rotate(-9 168 300)" opacity="0.82">
      <rect x="86" y="196" width="164" height="196" rx="12" fill="url(#pbCard)"/>
      <rect x="98" y="208" width="140" height="132" rx="7" fill="url(#pbPhoto)"/>
      <path d="M98 316l40-34 30 24 26-22 44 36v20a7 7 0 0 1-7 7H105a7 7 0 0 1-7-7z" fill="#2b7a69" fill-opacity="0.4"/>
      <circle cx="212" cy="234" r="12" fill="#ffffff" fill-opacity="0.7"/>
      <rect x="98" y="352" width="86" height="9" rx="4.5" fill="#2b7a69" fill-opacity="0.24"/>
      <rect x="98" y="368" width="58" height="9" rx="4.5" fill="#2b7a69" fill-opacity="0.16"/>
    </g>
    <g transform="rotate(8 540 300)" opacity="0.82">
      <rect x="458" y="196" width="164" height="196" rx="12" fill="url(#pbCard)"/>
      <rect x="470" y="208" width="140" height="132" rx="7" fill="url(#pbPhoto)"/>
      <path d="M470 316l42-30 28 22 30-26 40 34v20a7 7 0 0 1-7 7H477a7 7 0 0 1-7-7z" fill="#2b7a69" fill-opacity="0.4"/>
      <circle cx="584" cy="234" r="12" fill="#ffffff" fill-opacity="0.7"/>
      <rect x="470" y="352" width="86" height="9" rx="4.5" fill="#2b7a69" fill-opacity="0.24"/>
      <rect x="470" y="368" width="58" height="9" rx="4.5" fill="#2b7a69" fill-opacity="0.16"/>
    </g>
  </g>

  <!-- the winner, upright and in front -->
  <g filter="url(#pbShadow)">
    <rect x="243" y="146" width="217" height="262" rx="16" fill="url(#pbCard)"/>
    <rect x="259" y="162" width="185" height="176" rx="9" fill="url(#pbPhoto)"/>
    <!-- a sharp little scene: hills and a sun -->
    <circle cx="404" cy="196" r="19" fill="#ffd487"/>
    <path d="M259 306l52-46 39 31 34-30 60 51v23a9 9 0 0 1-9 9h-167a9 9 0 0 1-9-9z" fill="#2b7a69"/>
    <path d="M259 322l40-24 33 20 30-18 82 44v14a9 9 0 0 1-9 9h-167a9 9 0 0 1-9-9z" fill="#1d5449"/>
    <!-- measured scores -->
    <g>
      <rect x="259" y="352" width="140" height="11" rx="5.5" fill="#2b7a69" fill-opacity="0.18"/>
      <rect x="259" y="352" width="126" height="11" rx="5.5" fill="#2b7a69"/>
      <rect x="259" y="372" width="140" height="11" rx="5.5" fill="#2b7a69" fill-opacity="0.18"/>
      <rect x="259" y="372" width="104" height="11" rx="5.5" fill="#35937d"/>
    </g>
    <!-- chosen badge -->
    <circle cx="444" cy="160" r="34" fill="url(#pbBadge)" stroke="#ffffff" stroke-width="6"/>
    <path d="M429 160l11 12 20-23" fill="none" stroke="#7a4a08" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title strip -->
  <g>
    <rect x="182" y="440" width="339" height="52" rx="26" fill="#0d2b25" fill-opacity="0.42"/>
    <text x="351.5" y="474" text-anchor="middle" font-family="'Archivo Narrow', 'Inter Tight', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="700" letter-spacing="1.2" fill="#ffffff">WHICH ONE TO POST</text>
  </g>
</svg>
